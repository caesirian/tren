<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OneSignal Test</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial,sans-serif;
    }

    button{
      padding:14px 24px;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
    }

    .subscribe{
      background:#00d084;
      color:#000;
    }

    .subscribed{
      background:#333;
      color:#fff;
    }
  </style>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>

<body>

<button id="subscribeBtn" class="subscribe">
  Suscribirse
</button>

<script>
  const btn = document.getElementById("subscribeBtn");

  function setSubscribedState(){
    btn.innerText = "✓ Suscripto";
    btn.classList.remove("subscribe");
    btn.classList.add("subscribed");
  }

  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {

    await OneSignal.init({
      appId: "114f6665-eede-42d0-90ad-4d6480f10c76",
      notifyButton: {
        enable: false
      }
    });

    const optedIn =
      await OneSignal.User.PushSubscription.optedIn;

    if(optedIn){
      setSubscribedState();
    }

    btn.addEventListener("click", async () => {

      const permission =
        OneSignal.Notifications.permission;

      // Ya permitido
      if(permission === "granted"){

        setSubscribedState();

        alert("Ya estás suscripto a las notificaciones");

        return;
      }

      // Solicitar permiso
      await OneSignal.Notifications.requestPermission();

      const newOptedIn =
        await OneSignal.User.PushSubscription.optedIn;

      if(newOptedIn){

        setSubscribedState();

        alert("Suscripción activada correctamente");

      }else{

        alert("No se pudo activar la suscripción");

      }

    });

  });
</script>

</body>
</html>
