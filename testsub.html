<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba OneSignal Push</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#111;
      color:#fff;
      padding:20px;
    }

    h1{
      color:#00d084;
    }

    .box{
      background:#1f1f1f;
      border-radius:12px;
      padding:16px;
      margin-top:16px;
    }

    button{
      padding:12px 18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin-right:10px;
      margin-top:10px;
    }

    .primary{
      background:#00d084;
      color:#000;
    }

    .secondary{
      background:#444;
      color:#fff;
    }

    #log{
      margin-top:15px;
      background:#000;
      padding:10px;
      border-radius:8px;
      min-height:120px;
      white-space:pre-wrap;
      font-size:14px;
    }

    .status{
      font-size:18px;
      margin-top:10px;
    }
  </style>

  <!-- OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>

<body>

  <h1>Prueba de Push Notifications</h1>

  <div class="box">
    <div class="status">
      Estado: <span id="status">Cargando...</span>
    </div>

    <button class="primary" id="subscribeBtn">
      Suscribirse a notificaciones
    </button>

    <button class="secondary" id="permissionBtn">
      Ver permiso
    </button>

    <div id="log"></div>
  </div>

<script>
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");

  function log(msg){
    console.log(msg);
    logEl.innerHTML += msg + "\n";
  }

  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {

    log("Inicializando OneSignal...");

    await OneSignal.init({
      appId: "114f6665-eede-42d0-90ad-4d6480f10c76",
      notifyButton: {
        enable: true,
      },
      allowLocalhostAsSecureOrigin: true
    });

    log("OneSignal iniciado");

    async function updateStatus(){

      const permission = OneSignal.Notifications.permission;
      const optedIn = await OneSignal.User.PushSubscription.optedIn;
      const subscriptionId = OneSignal.User.PushSubscription.id;

      statusEl.innerHTML = optedIn
        ? "✅ Suscripto"
        : "❌ No suscripto";

      log("Permiso: " + permission);
      log("Opted In: " + optedIn);
      log("Subscription ID: " + subscriptionId);
    }

    await updateStatus();

    // BOTÓN SUSCRIPCIÓN
    document.getElementById("subscribeBtn")
      .addEventListener("click", async () => {

        log("Solicitando permiso...");

        try{

          await OneSignal.Notifications.requestPermission();

          const optedIn =
            await OneSignal.User.PushSubscription.optedIn;

          log("Suscripción: " + optedIn);

          await updateStatus();

        }catch(err){
          log("Error: " + err);
        }
      });

    // VER PERMISOS
    document.getElementById("permissionBtn")
      .addEventListener("click", async () => {

        const permission =
          OneSignal.Notifications.permission;

        alert("Permiso actual: " + permission);

      });

    // EVENTOS
    OneSignal.User.PushSubscription.addEventListener(
      "change",
      function(event) {
        log("Cambio de suscripción detectado");
        log(JSON.stringify(event, null, 2));
        updateStatus();
      }
    );

  });
</script>

</body>
</html>
