<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OneSignal Bell</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial,sans-serif;
    }

    .bell{
      cursor:pointer;
      transition:0.3s ease;
      user-select:none;
    }

    .bell svg{
      width:64px;
      height:64px;
      transition:0.3s ease;
    }

    /* APAGADA */
    .inactive svg{
      fill:#6f5a1e;
      opacity:.35;
      filter:none;
    }

    /* ACTIVA */
    .active svg{
      fill:#FFD700;
      opacity:1;
      filter:
        drop-shadow(0 0 6px rgba(255,215,0,.9))
        drop-shadow(0 0 16px rgba(255,215,0,.7))
        drop-shadow(0 0 28px rgba(255,215,0,.5));
    }

    .bell:hover{
      transform:scale(1.08);
    }
  </style>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>

<body>

<div id="bell" class="bell inactive">

  <svg viewBox="0 0 24 24">
    <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2z"/>
  </svg>

</div>

<script>

  const bell = document.getElementById("bell");

  function setSubscribed(){

    bell.classList.remove("inactive");
    bell.classList.add("active");

  }

  function setUnsubscribed(){

    bell.classList.remove("active");
    bell.classList.add("inactive");

  }

  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {

    await OneSignal.init({
      appId: "114f6665-eede-42d0-90ad-4d6480f10c76",
      notifyButton: {
        enable: false
      }
    });

    // Estado inicial
    const optedIn =
      await OneSignal.User.PushSubscription.optedIn;

    if(optedIn){
      setSubscribed();
    }else{
      setUnsubscribed();
    }

    // Click campana
    bell.addEventListener("click", async () => {

      const permission =
        OneSignal.Notifications.permission;

      if(permission === "granted"){

        setSubscribed();

        alert("Ya estás suscripto");

        return;
      }

      await OneSignal.Notifications.requestPermission();

      const newOptedIn =
        await OneSignal.User.PushSubscription.optedIn;

      if(newOptedIn){

        setSubscribed();

        alert("Suscripción activada correctamente");

      }else{

        setUnsubscribed();

        alert("La suscripción no fue activada");

      }

    });

  });

</script>

</body>
</html>
