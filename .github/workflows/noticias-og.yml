name: Generar páginas de noticias (Open Graph)

on:
  schedule:
    - cron: '*/15 * * * *'   # respaldo; la corrida normal la dispara el bot al publicar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias-og
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar páginas desde Firestore
        run: node scripts/generar-noticias.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A noticias sitemap-noticias.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: regenerar páginas de noticias"
            git push
          fi
